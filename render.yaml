services:
  # Single-Domain Full-Stack Web Service (React SPA + Express API + Socket.IO + Swagger)
  - type: web
    name: strata-mining-backend
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false # Set to your MongoDB Atlas connection string in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
